<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LumenSign 1.0 – A realtime translation tool for American Sign Language</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
  <main class="shell">
    <header class="hero">
      <div class="brand">
        <span class="brand__logo-wrapper">
          <img src="/static/LS_Logo.png" alt="Murdoch University" class="brand__logo" />
        </span>
        <div class="brand__copy">
          <h1 class="brand__title">LumenSign <span>1.0</span></h1>
          <p class="brand__subtitle">A realtime translation tool for American Sign Language</p>
        </div>
      </div>
      <span id="status" class="status">Initialising</span>
    </header>

    <section class="viewer">
      <div class="video-frame">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="overlay-canvas"></canvas>
      </div>
      <div class="caption-bar">
        <p id="prediction" class="caption-bar__text"> ··· </p>
        <span id="confidence" class="caption-bar__meta">Waiting for frames</span>
      </div>
    </section>

    <footer class="footer">
      <div class="footer__row">
        <div class="controls">
          <button id="speak-toggle" type="button" class="btn btn-voice">
            <span class="btn__icon" aria-hidden="true">🔇</span>
            <span class="btn__label">Voice Off</span>
          </button>
          <button id="clear-captions" type="button" class="btn btn-reset">
            <span class="btn__icon" aria-hidden="true">🧹</span>
            <span class="btn__label">Clear</span>
          </button>
          <button id="credits-btn" type="button" class="btn btn-credits">
            <span class="btn__icon" aria-hidden="true">ℹ️</span>
            <span class="btn__label">Credits</span>
          </button>
        </div>
        <p class="footnote">A Murdoch University Project. Built with <span>❤️</span> in Singapore.</p>
      </div>
    </footer>
  </main>
  <div id="credits-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="credits-title" aria-hidden="true">
    <div class="modal__dialog">
      <button type="button" class="modal__close" id="close-credits" aria-label="Close credits">×</button>
      <h2 id="credits-title">LumenSign <span>1.0</span></h2>
      <p class="modal__subtitle">Created by</p>
      <ul class="modal__list">
        <li><span>Benjamin Lee Wee Hao</span><span>33803039</span></li>
        <li><span>Sudeep Koshy Mathews</span><span>35451067</span></li>
        <li><span>Arindam Mani Das</span><span>35451094</span></li>
      </ul>
    </div>
  </div>
  <script src="/static/app.js" type="module"></script>
</body>

</html>
